; 配置唯一位置：MHGU 当前用户的存档根目录 /cb_moveset_to_4g.ini
; 地址均为 GU v1.4.0 的 main 相对偏移；修改设置后重启游戏生效。
; 动作 0xAA/0xAB、4G菜单、HDP 0x50 始终注册，不受任何功能开关影响。
[plugin]
; 总开关仅控制战斗功能；false 仍加载上述公共动作和HDP，不重定向原动作。
enabled = true

[styles]
; 六项功能只看各自的风格编号集合，没有第二个功能总开关；none全关。
; 0=公会、1=强袭、2=空战、3=武士道、4=炼金、5=勇气、6=4G。
; 7=预留；只提供0..7共八个编号，all仅包含这八项。
; 支持0,2,4,6、0-7、all,!3；黄盾变AED默认3/6，GP后退/防性默认6，后三项none。
; 4G复用公会资源，在本插件中映射为6；SAED仍使用全局开关。
; 黄盾变正常AED：命令的0x44/0x4B改用新增0xAA/0xAB。
; 新动作复用variant2/4资源，state3走普通大解/超解，不转黄盾0x4E/0x4F。
; 前置输入链为0x7EC..0x7F3，保留有瓶/强化盾/缓存输入；不用旧7处全局改字。
; 未选中的风格保留0x44/0x4B原动作；新动作仍然存在。
yellow_shield_aed = 3,6
; 011DDE74不再ORR 0x20，GP成功退后。
; 未选中风格重放原ORR R0,R0,#0x20，变形斩GP后继续变形。
; 狩技动作0x54始终保留原置位；不再硬编码三个风格。
gp_recoil = 6
; 4G 白盾 / 红盾防性：011DFB0C 替代盾斧威力修正；技能仍先按 GU 处理。
; GP 阶段 +0x333C=1、通用防御位 +0x2510&0x10、实际 GP 动画同时成立时，威力减 10，最低 1。
; 不依赖 GP 后退会取消的 +0x3340&0x20；普通防御及动作切换后的遗留阶段不算 GP。
; 002F0800 仅红盾盾斧改为：小硬直 <40、中硬直 40..49、大硬直 >=50。
; 白盾仍用 15/40；红盾不再先减 GU 的 10，避免与新阈值重复。黄 / 蓝盾保持 GU 原判定。
; 未选中的风格完整执行原GU回调和阈值；none时不安装这两处桥接。
; 与gp_recoil独立，原版/新增风格均按编号配置。
guard_performance = 6
; 盾突X+A接黄盾前置0x44；适用所选风格，无盾突的风格不新增盾突。
; 002EA87C：武器14、链0x7FA第1条，仅改本次命令前24字节。
; act_st=0x10/act_no=0x44/param=0/cmd_type=8/input=0x1B；窗口保留。
; 0x44原本仍会上黄盾；配合本风格yellow_shield_aed才能变为普通AED/SAED。
shield_thrust_yellow = none
; 防御小退/中退后追加X+A接黄盾前置0x4B；仅所选风格。
; 002E9B7C初始化原链0x802/0x803后，在玩家副本末尾追加一项，原派生不删。
; 借用本风格第1条的Active/Pre/Start/End：小退Start30，中退Start42。
; 002EA87C仅将副本末条改为0x10/0x4B/param0/type8/input0x1B。
; 大退不追加；0x4B仍是黄盾，配合yellow_shield_aed才转新增0xAB普通AED/SAED。
guard_recoil_yellow = none
; 大解额外派生：002E9B7C后为所选风格建立玩家表副本。
; 保留0x7F4/0x7F5/0x839/0x83A全部记录，追加本风格0x7DC第1条起记录。
; 红盾取消057a的Pre0/Start0/End28保留；排除追加源第0条弹刀。
; 原命令条件、窗口、原斧竖劈弹刀均保留；不改四处旧整链替换指令。
; none不启用此合并；与防御后追加共用一个初始化钩子。
aed_followups = none

[style]
; 原版风格菜单确认“4G”时自动保存；选原版风格时清除。只作用本机公会盾斧。
; 选择4G不会另开一套战斗逻辑，使用上方六项编号集合；超解随全局开关。
selected = false

[moveset]
; J guard成功后X+A接黄盾前置0x44，独立全局默认开启，仅武士道有此入口。
; 002EA87C：仅盾斧 14、风格 3、链 0x81A 的第 3 条临时命令改为 act_st=0x10。
; act_no=0x44、输入编号=0x1B；Pre=20/Start=30/End=0 保留，不替换共享派生表。
; 0x44原本仍会上黄盾；配合本风格yellow_shield_aed才转普通AED/SAED。
; false保留原X+A盾突派生；与所选风格盾突/防御后路由共用一个桥接。
j_guard_aed = true

[saed]
; 全风格共用总开关：原21处改值和3个瓶爆钩子一起启停，不另设风格列表。
; 1. 地面 / 空中超解追加第三 hit：011DADD4..011DADE8、011DBDA0..011DBDB4。
; 地面调用新增 0x50（延迟 0、持续 8、动作值 100）；空中调用现有 0x23。
; 011DB18C/011DBE50：后续帧常量 108 -> 109；不修改原动作 0x4F 的调用。
; HDP 00270C18始终80条扩为81条并追加0x50；不受本开关和风格限制。
; 2. 瓶伤：0048906C..00489078 固定系数 1.35，不再按剩余瓶数递增。
; 3. 瓶爆：00488C0C/00488DE4/00488BDC 接管初始化 / 更新 / 销毁。
; 按真实瓶数逐次爆炸，每爆减一；支持 1..10 瓶；每爆同时生成特效和攻击判定。
; 榴弹首爆等待 0、人物前方 270；之后间隔 9、每爆前进 100。
; 强属性首爆等待 46、人物前方 300；后续为 1/2/3/4 点扇形，纵向每组加 120。
; 相对首爆时间：0/18/20/38/40/42/58/60/62/64；横向：0/±80/±120,0/±160,±160/3。
; 首爆锁定人物位置；逐爆探测地面 Y（+300..-2000，失败再 +2000..+300）。
; 两种瓶爆镜头震动统一 20/1024；最后一爆后等待 9 再回收。
; 4. 瓶爆特效：011DE830/011DE838/011DE83C，有瓶统一使用下方档位。
; 关闭时用原第三hit/帧/瓶伤/特效选档及SH驱动的瓶爆逻辑；HDP仍保持81条。
enabled = true
; 随全局saed.enabled启停，默认2，允许1..4；关闭保留原选档指令。
; 这是资源档位，不是 effectId 或瓶数；真实瓶数 / 爆炸次数不变，零瓶仍不创建进程。
effect_gear = 2

[values]
; 红 / 蓝盾补正改为1.2，黄盾保持1.0；各风格共用。
; 011DF8B0/011DF8D0：补正档位统一设为2；false不修改这两处。
shield_multiplier = true
; 大解瓶爆镜头震动：0048859C的mov r1,#15改为固定20，仅提供启停。
; false保留GU原值15；这是“大解瓶爆震动”那条金手指。
aed_camera_shake = true

[hitdata]
; HDP 00270C18 加载成功后：0x00..0x4E 的 79 条复制项目内嵌 asset 完整数据。
; 0x4F 恢复完整 GU 原版（延迟 106、持续 6、动作值 55），不使用 asset 的 0/8/100。
; 关闭则不复制这80条；新增0x50始终保留，不受本开关或SAED开关影响。
enabled = true
