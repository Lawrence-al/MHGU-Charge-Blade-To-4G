; 配置唯一位置：MHGU 当前用户的存档根目录 /cb_moveset_to_4g.ini
; true=安装下面列出的修改；false=不安装该组，不撤销其它 mod / 资源文件的修改。
; 地址均为 GU v1.4.0 的 main 相对偏移；超模默认关闭，其余保持原有默认值。
[plugin]
; 总开关：控制本 NRO 全部派生、盾补正、震动、SAED、Hitdata、超模补丁和钩子。
; false 时本 NRO 不修改游戏；独立的 Presentation 音效 / 特效仍运行。
enabled = true

[moveset]
; 上黄盾改为普通大解：公会、空战、炼金；炼金仅 GP / 蓄力斩后，其它仍上黄盾。
; 011DA634/011DA5EC/011DA610/011DA5C0/011DA43C：比较值 2 -> 5。
; 011DA4B8/011DA4C0：派生值 0x40 -> 0x1A8；关闭则这 7 处均不修改。
yellow_shield_aed = true
; 红 / 蓝盾补正改为 1.2，黄盾保持 1.0。
; 011DF8B0/011DF8D0：补正档位统一设为 2；关闭则不修改这两处。
shield_multiplier = true
; 公会、空战、炼金 GP 后退；其它风格及狩技按原金手指保留原行为。
; 011DDE74：装备 +0x4D9 为 1/3/5 或玩家动作字节 +0x250A 为 0x54 时置位 0x20。
; 关闭则不安装该桥接，使用原版无条件置位逻辑。
gp_recoil = true
; 武士 J 防成功后 X+A -> 大解前置 action 0x44。
; 002EA87C：仅盾斧 14、风格 3、链 0x81A 的第 3 条临时命令改为 act_st=0x10。
; act_no=0x44、输入编号=0x1B；Pre=20/Start=30/End=0 保留，不替换共享派生表。
; 关闭则不安装此命令改写，保留原 X+A 盾突派生。
j_guard_aed = true
; 武士道盾斧盾突后 X+A -> 大解前置 action 0x44；与上面的 J 防派生独立启停。
; 同用 002EA87C 入口，仅风格 3、武器 14、链 0x7FA 的第 1 条临时命令。
; 改为 act_st=0x10 / act_no=0x44 / act_param=0 / cmd_type=8 / cmd_param0=0x1B。
; Pre=10 / Start=34 / End=0 不变；不替换共享 071a，也不改第 7 条原盾突命令。
; false 保留原 X+A 派生；两个开关都关闭时不安装这处桥接。
bushi_shield_thrust_aed = true
; 大解瓶爆镜头震动：0048859C 的 mov r1,#15 改为下方指定整数。
; 关闭则不改该处，GU 原值为 15；这是“大解瓶爆震动”那条金手指。
aed_camera_shake = true
aed_shake_strength = 20 ; 0..255，仅上方开关启用时生效

[saed]
; 整组开关：以下 21 处改值、第三 hit 的 HDP 扩容及 3 个瓶爆钩子同时启停。
; 1. 地面 / 空中超解追加第三 hit：011DADD4..011DADE8、011DBDA0..011DBDB4。
; 地面调用新增 0x50（延迟 0、持续 8、动作值 100）；空中调用现有 0x23。
; 011DB18C/011DBE50：后续帧常量 108 -> 109；不修改原动作 0x4F 的调用。
; HDP 00270C18：80 条扩为 81 条，末尾加 0x50；Hitdata 开关独立控制前 80 条。
; 2. 瓶伤：0048906C..00489078 固定系数 1.35，不再按剩余瓶数递增。
; 3. 瓶爆：00488C0C/00488DE4/00488BDC 接管初始化 / 更新 / 销毁。
; 按真实瓶数逐次爆炸，每爆减一；支持 1..10 瓶；每爆同时生成特效和攻击判定。
; 榴弹首爆等待 0、人物前方 270；之后间隔 9、每爆前进 100。
; 强属性首爆等待 46、人物前方 300；后续为 1/2/3/4 点扇形，纵向每组加 120。
; 相对首爆时间：0/18/20/38/40/42/58/60/62/64；横向：0/±80/±120,0/±160,±160/3。
; 首爆锁定人物位置；逐爆探测地面 Y（+300..-2000，失败再 +2000..+300）。
; 两种瓶爆镜头震动统一 20/1024；最后一爆后等待 9 再回收。
; 4. 瓶爆特效：011DE830/011DE838/011DE83C，有瓶统一使用下方档位。
; 关闭则以上全部不安装，使用原游戏 / SH 的超解逻辑；不会关闭独立 Hitdata。
enabled = true
; 随 saed.enabled 一起启停：011DE830 的 mov r9,#档位，默认 2，允许 1..4。
; 这是资源档位，不是 effectId 或瓶数；真实瓶数 / 爆炸次数不变，零瓶仍不创建进程。
effect_gear = 2

[hitdata]
; HDP 00270C18 加载成功后：0x00..0x4E 的 79 条复制项目内嵌 asset 完整数据。
; 0x4F 恢复完整 GU 原版（延迟 106、持续 6、动作值 55），不使用 asset 的 0/8/100。
; 关闭则不复制这 80 条；新增 0x50 由 SAED 开关控制，不受本开关影响。
enabled = true

[overpowered]
; 002E9B7C：原派生初始化后，为当前盾斧玩家建立表副本；六种风格分别读取当前资源。
; 保留原链 0x7F4/0x7F5/0x839/0x83A 的全部记录，再追加本风格 0x7DC 的第 1 条起记录。
; 红盾取消 057a 的 Pre=0/Start=0/End=28 保留；其它原命令及追加命令的条件和窗口均不改。
; 不再改 011DACF0/011DAF74/011DB0B4/011DB0FC，也不安装 002EA864 的弹刀查询屏蔽。
; 大解追加内容排除第 0 条弹刀；正常斧竖劈自身的弹刀保持原版。
; 关闭则不安装该合并钩子，使用原表；链号和共享资源始终不修改。
enabled = false
