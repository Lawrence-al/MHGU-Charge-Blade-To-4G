; 配置位置：MHGU 当前用户存档根目录 /cb_style_to_4g.ini。
; 此 NRO 负责原版菜单新增 4G 选择、独立前置动作及其后续派生。
; 音效 / 特效和其它战斗改动继续由 Presentation / Moveset 负责。
[plugin]
; 启动时决定是否安装菜单、动作分发和临时命令重定向；修改此项后重启。
enabled = true

[style]
; 在原版“狩猎风格”菜单里选择第七项 4G 时即时更新并保存。
; 选择原六种风格时设为 false；只对本机公会盾斧生效。
; 引擎内部仍用公会编号 0，不把新编号传入原版只有六项的资源表。
; 本值属于插件选择，不写进装备套装；换套装后仍沿用本值，需在风格菜单切回公会以取消。
selected = false
