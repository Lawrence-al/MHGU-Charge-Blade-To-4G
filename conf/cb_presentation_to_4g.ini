; Presentation-to-4G：保存为 UTF-8，重启游戏生效。
; 配置唯一位置：MHGU 当前用户的存档根目录 /cb_presentation_to_4g.ini
; 帧和持续时间最大 10000；持续时间必须大于 0，音量范围 -96..12。
[plugin]
enabled = true

[sounds]
; 自定义按帧音效和原版 MSS 重复音效屏蔽一起启停。
enabled = true
; SRQ / PTS 只在资源加载时修改；关掉不会撤销其它 mod 的资源文件修改。
patch_srq = true
patch_pts = true
; request 0x4A 的两个音量字段；重播间隔保持 0，允许连续起播。
volume_4a = -1.9

[effects]
; 所有主动盾牌闪电的总开关；附加对象、骨骼和瓶型选择不变。
enabled = true
shield_thrust = true
shield_thrust_duration = 30

; action 为大解/超解本体；burst 为大解前置子动作。编号与菜单一致。
; 每条任务可独立启停并修改触发帧；特效额外提供持续帧。
; effectId、requestId、actionState、variant 和挂点继续使用原任务表。

; actionState=1 variant=1|7，盾牌 0x258/0x259。
[action.0]
enabled = true
frame = 1
duration_frames = 30
; actionState=1 variant=2|9，盾牌 0x262/0x263。
