; Presentation-to-4G：保存为 UTF-8，重启游戏生效。
; 自动选择配置位置。Switch/Ryujinx使用当前用户存档根目录。
; 重编译使用nativeNX/plugins/cb_presentation_to_4g.ini，默认INI需随NRO安装。
; 菜单Save INI保存到当前环境读取的同一文件。手动修改后重启。
; 帧和持续时间最大10000；原GU任务及盾突持续时间必须大于0；音量范围-96..12。
[plugin]
enabled = true

[sounds]
; 自定义按帧音效、原版MSS重复声屏蔽、一二解/大解逐次瓶爆声一起启停。
; 瓶爆在0048874C每次伤害入口按当次爆点发声，三连不依赖GU/4G视觉选择。
; 只追加公共0x7D3/0x7D4：榴弹-6dB/并发2，强属性-4.5dB/并发4，均延迟0/重播10ms。
; 同时撤下208/209/212/213原PTS创建声，避免首爆重复；0x4B及超解声音保持。
; 关闭本项则不追加这两条、不改这四条PTS、不逐次提交，使用原GU瓶爆声。
; 这组瓶爆声与patch_srq/patch_pts、4g_effects的视觉选择独立。
enabled = true
; SRQ / PTS 只在资源加载时修改；关掉不会撤销其它 mod 的资源文件修改。
patch_srq = true
patch_pts = true
; 屏蔽盾突、一二解、大解和超解瓶爆命中的公共飙血声0x82/83/84，默认开启。
; 001808CC进入NRO并保留D8分支落点，按直接来源Shell002/003识别动作结束后的迟发瓶爆。
; 此键沿用旧名mute_aed_phial_blood；菜单显示为Mute phial blood sound。
; 与上面的按帧音效开关独立；false不安装此桥接，保存后重启。
mute_aed_phial_blood = true
; 黄/红充能特效UNIQUE26C/26D通过原PTS创建事件发声。
; request0x57从0x4D复制，两路音量0dB、启播延迟0；PTS请求号由0x4D改为0x57。
; 提示音时机和挂点跟随原特效流程。开关独立于sounds.enabled/patch_srq/patch_pts。
; true使用0dB的0x57；false由原PTS调用0x4D。
phial_charge_cues = true
; request 0x4A 的两个音量字段；重播间隔保持 0，允许连续起播。
volume_4a = -1.9

[effects]
; 原GU主动闪电总开关：保留原资源、盾牌骨骼0及各任务时长，不整段替换005/103。
enabled = true
shield_thrust = true
shield_thrust_duration = 30

[4g_effects]
; 六项独立开关，只改视觉；原GU闪电、音效、伤害、瓶数和瓶爆时序保持。
; 有瓶大解：Shell02 type2/3创建瓶附加时，在真实命中部位追加005第二段。
; 空挥用原PSL尘土0x78的实际请求及PEL位置；命中后跳过/立即取消同次地爆，不再固定66帧。
; 源group0/1后四单元扣去原66tick延迟，并以主闪光为中心统一前移-200；保留层间位置。
aed_explosion = true
; 有瓶超解：发瓶前登记真实瓶数，地面原IS_ack跨111帧追加103；空战按实际落地发瓶事件。
; 无瓶不追加103；位置沿用GU砸下几何点（人物前方230，含坡面角），创建后固定世界位置。
; 源group2/3映射group0/1，榴弹/属性整组分别前移-200/-230居中，保留内部延迟和自然寿命。
saed_explosion = true
; 原GU1FE/1FF瓶附加阶段替换002；榴弹group0、强属性group1，覆盖type0..3。
; 真实节点交回slot5596；第一下瓶爆开始时立即关闭002已有粒子，伤害和原清槽照常。
phial_attachment = true
; 一解/二解延迟瓶爆：208榴弹→003，209强属性→008；只限selector0，盾突selector1不改。
; 属性按实际攻击位16/64/32/512/128选mask1/2/4/8/16，不把所有颜色叠在一起。
ed_blast = true
; 大解三次延迟瓶爆：212榴弹→006，213强属性→009；沿用原命中坐标、PEP、判定/计时。
; 每次瓶伤各建一次粒子；末次mask左移10。启用sounds.enabled时，三次声音由瓶伤入口分别提交。
aed_blast = true
; 超解每次瓶爆→107；覆盖GU及Moveset；榴弹group0普通/1末瓶，属性group2..6/末瓶10..14。
; 实际爆点探测48字节地表记录，由原生00041D30分类干地/浅水/深水，不改伤害位置。
; 4G107观感较糊，默认关闭：使用GU原超解瓶爆特效；不关闭103砸地或Moveset超解功能。
saed_blast = false

