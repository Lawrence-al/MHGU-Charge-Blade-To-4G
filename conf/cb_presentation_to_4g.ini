; Presentation-to-4G：保存为 UTF-8，重启游戏生效。
; 配置唯一位置：MHGU 当前用户的存档根目录 /cb_presentation_to_4g.ini
; 帧和持续时间最大10000；原GU任务及盾突持续时间必须大于0；音量范围-96..12。
[plugin]
enabled = true

[sounds]
; 自定义按帧音效和原版 MSS 重复音效屏蔽一起启停。
enabled = true
; SRQ / PTS 只在资源加载时修改；关掉不会撤销其它 mod 的资源文件修改。
patch_srq = true
patch_pts = true
; request 0x4A 的两个音量字段；重播间隔保持 0，允许连续起播。
volume_4a = -1.9

[effects]
; 原GU主动闪电总开关：保留原资源、盾牌骨骼0及各任务时长，不整段替换005/103。
enabled = true
shield_thrust = true
shield_thrust_duration = 30

[4g_effects]
; 六项独立开关，只改视觉；原GU闪电、音效、伤害、瓶数和瓶爆时序保持。
; 有瓶大解：Shell02 type2/3创建瓶附加时，在真实命中部位追加005第二段。
; 空挥用原PSL尘土0x78的实际请求及PEL位置；命中后跳过/立即取消同次地爆，不再固定66帧。
; 源group0/1后四单元扣去原66tick延迟，并以主闪光为中心统一前移-200；保留层间位置。
aed_explosion = true
; 有瓶超解：发瓶前登记真实瓶数，地面原IS_ack跨111帧追加103；空战按实际落地发瓶事件。
; 无瓶不追加103；位置沿用GU砸下几何点（人物前方230，含坡面角），创建后固定世界位置。
; 源group2/3映射group0/1，榴弹/属性整组分别前移-200/-230居中，保留内部延迟和自然寿命。
saed_explosion = true
; 原GU1FE/1FF瓶附加阶段替换002；榴弹group0、强属性group1，覆盖type0..3。
; 真实节点交回slot5596；第一下瓶爆开始时立即关闭002已有粒子，伤害和原清槽照常。
phial_attachment = true
; 一解/二解延迟瓶爆：208榴弹→003，209强属性→008；只限selector0，盾突selector1不改。
; 属性按实际攻击位16/64/32/512/128选mask1/2/4/8/16，不把所有颜色叠在一起。
ed_blast = true
; 大解三次延迟瓶爆：212榴弹→006，213强属性→009；沿用原命中坐标、PEP、判定/计时。
; 每次瓶伤各建一次粒子；末次mask左移10，新增的第二/第三份不重复提交原PTS音效。
aed_blast = true
; 超解每次瓶爆→107；覆盖GU及Moveset；榴弹group0普通/1末瓶，属性group2..6/末瓶10..14。
; 实际爆点探测48字节地表记录，由原生00041D30分类干地/浅水/深水，不改伤害位置。
; 4G107观感较糊，默认关闭：使用GU原超解瓶爆特效；不关闭103砸地或Moveset超解功能。
saed_blast = false

; action 为大解/超解本体；burst 为大解前置子动作。编号与菜单一致。
